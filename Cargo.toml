[package]
name = "ferrite-lodestone"
version = "0.3.2"
description = "One window for every Ferrite app: install them from GitHub, launch them, share one look."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-lodestone"
readme = "README.md"
keywords = ["gpui", "ferrite", "launcher", "desktop", "gui"]
categories = ["gui", "development-tools"]
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "lodestone"
path = "src/main.rs"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "4ddbb40bf34e219278784fdcb4e5d0e4e76f4cdc" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
serde_json = "1.0.151"
sha2 = "0.10.9"
ureq = "3.4.2"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
